<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="800" viewBox="0 0 2560 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0d140d"/>
      <stop offset="0.55" stop-color="#101a12"/>
      <stop offset="1"    stop-color="#1a2b1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.13" cy="0.16" r="0.5">
      <stop offset="0" stop-color="#2e7d4f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2e7d4f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="800" fill="url(#bg)"/>
  <rect width="2560" height="800" fill="url(#glow)"/>

  <!-- DNA helix mark (compact, top-left beside the kicker) -->
  <g stroke="#5bbd86" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M108 94 C 150 116, 150 146, 108 168"/>
    <path d="M146 94 C 104 116, 104 146, 146 168"/>
    <line x1="114" y1="102" x2="140" y2="102"/>
    <line x1="120" y1="118" x2="134" y2="118"/>
    <line x1="120" y1="144" x2="134" y2="144"/>
    <line x1="114" y1="160" x2="140" y2="160"/>
  </g>

  <!-- kicker -->
  <text x="206" y="150" fill="#5bbd86" font-family="Menlo, 'Andale Mono', 'DejaVu Sans Mono', monospace"
        font-size="40" font-weight="700" letter-spacing="9">FUNGAL ONT / ILLUMINA / HYBRID GENOMICS</text>

  <!-- wordmark -->
  <text x="110" y="322" font-family="Georgia, 'PT Serif', 'DejaVu Serif', serif" font-size="150" font-weight="700">
    <tspan fill="#f2efe6">Fungi</tspan><tspan fill="#2e8b57">Forge</tspan>
  </text>

  <!-- subtitle -->
  <text x="114" y="402" fill="#cfc9bd" font-size="46">Assembly &#8594; annotation &#8594; ITS/genome ID &#8594; antifungal resistance &#8594;</text>
  <text x="114" y="460" fill="#cfc9bd" font-size="46">mobile/TE/mycovirus &#8594; biosynthetic gene clusters &#8594; novelty &#8594; One Health.</text>

  <!-- accent rule -->
  <rect x="116" y="502" width="250" height="7" rx="3.5" fill="#4aa06a"/>

  <!-- legend -->
  <g font-family="Menlo, 'Andale Mono', 'DejaVu Sans Mono', monospace" font-size="32" font-weight="700">
    <circle cx="128" cy="666" r="11" fill="#86e0aa"/>
    <text x="152" y="677" fill="#efeadd">assembly</text>
    <circle cx="372" cy="666" r="11" fill="#e0b34a"/>
    <text x="396" y="677" fill="#efeadd">annotation</text>
    <circle cx="672" cy="666" r="11" fill="#e0736b"/>
    <text x="696" y="677" fill="#efeadd">antifungal resistance</text>
    <circle cx="1236" cy="666" r="11" fill="#6a9fe0"/>
    <text x="1260" y="677" fill="#efeadd">BGCs</text>
  </g>

  <!-- badge pill -->
  <rect x="1430" y="637" width="1012" height="58" rx="29" fill="#8fe0ab"/>
  <text x="1936" y="675" text-anchor="middle" fill="#123322"
        font-family="Menlo, 'Andale Mono', 'DejaVu Sans Mono', monospace" font-size="29" font-weight="700"
        letter-spacing="1">Nextflow DSL2 &#183; 15 stages &#183; organism-agnostic</text>
</svg>

# fungiforge base env — the light tools for the stages that don't use a dedicated
# public image (identify, resistance, mge, extras-lite, report, read filtering).
# Baked into the aduton1000/fungiforge base image (env/Dockerfile) and the Apptainer
# .def. Pure-ish; solves on linux-64 (native on HPC, emulated on Mac).
name: fungiforge-base
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - procps-ng          # `ps` — required by Nextflow's task wrapper (all nf-core images ship it)
  - fastp>=0.23        # Illumina read QC (hybrid path)
  # identification / novelty
  - itsx>=1.1.3
  - barrnap>=0.9
  - sourmash>=4.8
  - skani>=0.2.2
  - fastani>=1.34
  - blast>=2.15
  - diamond>=2.1
  - vsearch>=2.28
  - mlst>=2.23
  - iqtree>=2.3
  - mafft>=7.5
  # resistance / mge
  - hmmer>=3.4
  - pyhmmer>=0.10
  - minimap2>=2.26
  - samtools>=1.19
  - genomad>=1.8
  - seqkit>=2.6
  # read filtering (light)
  - chopper>=0.9
  - nanoplot>=1.42
  # report / glue
  - biopython>=1.81
  - pandas>=2.0
  - numpy>=1.24
  - jinja2>=3.1
  - pip

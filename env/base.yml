# fungiforge base env — the light tools for the stages that don't use a dedicated
# public image (identify, resistance, mge, extras-lite, report, read filtering).
# Baked into the aduton1000/fungiforge base image (env/Dockerfile) and the Apptainer
# .def. Pure-ish; solves on linux-64 (native on x86_64 Linux, emulated on arm64 hosts).
#
# Versions are pinned exactly (W0.2) to what the validated image contains. The image build
# itself installs from env/base.linux-64.lock (an explicit, URL+md5 lock of the full solved
# environment, exported from the validated image), so a rebuild is byte-identical in its
# conda layer. To upgrade a tool: change the pin here, re-solve, regenerate the lock with
# bin/lock_env.sh, rebuild, re-validate.
name: fungiforge-base
channels: [conda-forge, bioconda]
dependencies:
  - python==3.11.9
  - procps-ng==4.0.6          # `ps` — required by Nextflow's task wrapper (all nf-core images ship it)
  - fastp==1.3.6        # Illumina read QC (hybrid path)
  # identification / novelty
  - itsx==1.1.3
  - barrnap==1.10.6
  - sourmash==4.9.4
  - skani==0.3.2
  - fastani==1.34
  - blast==2.16.0
  - diamond==2.1.10
  - vsearch==2.29.1
  - mlst==2.35.0
  - bigscape==2.0.3    # W3.2: gene-cluster families across the cohort (BiG-SCAPE 2; uses the funannotate DB Pfam-A.hmm)
  - iqtree==3.1.3
  - mafft==7.526
  # resistance / mge
  - hmmer==3.4
  - pyhmmer==0.12.1
  - minimap2==2.28
  - purge_dups==1.2.6  # W4.1/L30: haplotig purging as its own stage (the assembler images lack it)
  - samtools==1.21
  - genomad==1.12.0
  - kraken2==2.1.3      # Stage 04 contig decontamination + bin/triage_reads.sh (was only in decontam.yml)
  - seqkit==2.13.0
  # read filtering (light) + k-mer profile (W2.2)
  - kmc==3.2.4         # k-mer counting for the genome-size / heterozygosity / coverage profile
  - genomescope2==2.0.1  # k-mer spectrum model (R); reports genome size, heterozygosity, k-mer coverage
  - chopper==0.9.0
  - nanoplot==1.47.1
  # report / glue
  - biopython==1.87
  - pandas==2.3.3
  - numpy==1.26.4
  - jinja2==3.1.6
  - multiqc==1.25.1    # W3.3: cohort report from the custom content stage 17 writes
  - pip

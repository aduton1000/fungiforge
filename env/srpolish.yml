# Stage 03b — short-read (Illumina) polishing of the Medaka consensus (Polypolish).
# Split from stage 03 (Medaka) because the two tools ship in different containers;
# under -profile conda this single env provides both the aligner and Polypolish.
name: ff-srpolish
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - polypolish>=0.6
  - bwa>=0.7.17
  - samtools>=1.19
